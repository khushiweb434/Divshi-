<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      color: white;
      text-align: center;
      padding-top: 120px;
    }

    h1 {
      font-size: 55px;
      animation: fadeIn 2s ease-in;
    }

    p {
      font-size: 22px;
      margin-top: 20px;
      animation: fadeIn 3s ease-in;
    }

    .box {
      background: rgba(0,0,0,0.2);
      padding: 30px;
      width: 70%;
      margin: auto;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Happy 20th Birthday ❤️</h1>
    <p>
      You are not just a year older,<br>
      you are more special, more loved, and more important than ever.<br><br>

      I hope your 20s bring you everything you dream of.<br>
      And I’m lucky to be part of your life 💕<br><br>

      <b>Always yours ❤️</b>
    </p>
  </div>

</body>
</html>
