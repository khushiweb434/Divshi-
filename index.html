<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday ❤️</title>

    <style>
        body{
            margin:0;
            padding:0;
            background: linear-gradient(135deg,#ff9a9e,#fad0c4);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
            overflow:hidden;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
        }

        h1{
            color:#ff4d6d;
            font-size:50px;
        }

        p{
            font-size:20px;
            color:#444;
        }

        button{
            padding:12px 25px;
            border:none;
            background:#ff4d6d;
            color:white;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:#e63956;
        }

        @keyframes float{
            0%{transform:translateY(0px);}
            50%{transform:translateY(-10px);}
            100%{transform:translateY(0px);}
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Happy Birthday ❤️</h1>

    <p>
        Happy Birthday My Love 🎂<br><br>
        You are the best thing in my life 💖
    </p>

    <button onclick="showMessage()">
        Click Me
    </button>
</div>

<script>
function showMessage(){
    alert("I Love You Forever ❤️");
}
</script>

</body>
</html>
