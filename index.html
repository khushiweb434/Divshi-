<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    background:black;
    color:white;
}

section{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

.hero{
    background:linear-gradient(135deg,#ff4d6d,#ff758f);
}

.hero h1{
    font-size:70px;
    animation:fadeIn 2s ease;
}

.hero p{
    margin-top:20px;
    font-size:22px;
}

.btn{
    margin-top:30px;
    padding:15px 30px;
    background:white;
    color:#ff4d6d;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
}

.memories{
    background:#111;
}

.memories img{
    width:250px;
    border-radius:20px;
    margin:15px;
    transition:0.5s;
}

.memories img:hover{
    transform:scale(1.05);
}

.message{
    background:linear-gradient(135deg,#6a11cb,#2575fc);
}

.message h2{
    font-size:50px;
}

.message p{
    max-width:700px;
    margin-top:20px;
    line-height:1.8;
    font-size:20px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hearts{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    overflow:hidden;
    z-index:-1;
}

.hearts span{
    position:absolute;
    display:block;
    color:#ff4d6d;
    animation:animate 10s linear infinite;
    bottom:-150px;
    font-size:30px;
}

@keyframes animate{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(-1000px) rotate(360deg);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="hearts">
    <span style="left:10%">❤️</span>
    <span style="left:30%">❤️</span>
    <span style="left:50%">❤️</span>
    <span style="left:70%">❤️</span>
    <span style="left:90%">❤️</span>
</div>

<section class="hero">
    <h1>Happy Birthday My Love ❤️</h1>

    <p>
        Today is all about you 🎂
    </p>

    <button class="btn" onclick="scrollToMemories()">
        Open Surprise
    </button>
</section>

<section class="memories" id="memories">

    <h2 style="margin-bottom:30px;font-size:50px;">
        Our Memories 📸
    </h2>

    <div>
        <img src="photo1.jpg">
        <img src="photo2.jpg">
        <img src="photo3.jpg">
    </div>

</section>

<section class="message">

    <h2>I Love You ❤️</h2>

    <p>
        Thank you for being the most beautiful part of my life.
        I hope your birthday becomes as special as your smile.
        You deserve all happiness in the world 💖
    </p>

</section>

<audio autoplay loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<script>

function scrollToMemories(){
    document.getElementById("memories").scrollIntoView({
        behavior:'smooth'
    });
}

</script>

</body>
</html>
